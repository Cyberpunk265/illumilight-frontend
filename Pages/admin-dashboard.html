<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illumilight | Admin Dashboard</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .admin-container { max-width: 1300px; margin: 40px auto; padding: 20px; }
    .admin-header { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center; }
    .admin-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 0; overflow:hidden; }
    .panel-top { padding: 20px 25px; display:flex; justify-content:space-between; align-items:center; }
    #logoutButton { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    #statusMessage { color: var(--muted); font-size:13px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse: collapse; font-size:13px; min-width: 1000px; }
    thead th { text-align:left; padding:14px 12px; color:var(--gold); border-bottom:1px solid var(--border); background:#0d0d0d; font-size:12px; letter-spacing:0.5px; }
    tbody td { padding:13px 12px; border-bottom:1px solid #1a1a1a; vertical-align:middle; }
    tbody tr:hover { background:#111; }
    .code-cell { color:var(--gold); font-weight:bold; white-space:nowrap; }
    .status-approved { color:#4ade80; font-weight:bold; }
    .status-pending { color:#facc15; font-weight:bold; }
    .status-rejected { color:#f87171; font-weight:bold; }
    .btn-approve { background:#22c55e; color:#fff; border:none; padding:7px 14px; border-radius:5px; cursor:pointer; font-weight:bold; margin-right:6px; }
    .btn-reject { background:#ef4444; color:#fff; border:none; padding:7px 14px; border-radius:5px; cursor:pointer; font-weight:bold; }
    .btn-approve:disabled, .btn-reject:disabled { opacity:0.5; }
    .search-row { padding:0 25px 15px; }
    #searchInput { width:100%; padding:10px; background:#000; border:1px solid var(--border); border-radius:6px; color:#fff; }
  </style>
</head>
<body>
  <main class="admin-container">
    <div class="admin-header">
      <div>
        <h1 style="margin:0;">Illumilight Administration</h1>
        <p style="color:var(--muted);margin:5px 0 0;">Membership Management Portal</p>
      </div>
      <button id="logoutButton" type="button">Sign Out</button>
    </div>

    <section class="admin-panel">
      <div class="panel-top">
        <h2 style="margin:0;">Membership Applications</h2>
        <p id="statusMessage">Verifying administrator access...</p>
      </div>
      <div class="search-row"><input id="searchInput" placeholder="Search by name, email, code..."></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>DOB</th>
              <th>Gender</th>
              <th>Reason</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="applicationsList"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@21.0.0"></script>
  <script>
    const client = new Appwrite.Client();
    client.setEndpoint("https://fra.cloud.appwrite.io/v1").setProject("6ae27aad00007b481204");
    const account = new Appwrite.Account(client);
    const functions = new Appwrite.Functions(client);

    const statusMessage = document.getElementById("statusMessage");
    const logoutButton = document.getElementById("logoutButton");
    const applicationsList = document.getElementById("applicationsList");
    const searchInput = document.getElementById("searchInput");
    let allApps = [];

    async function runAdminAction(action, rowId = null) {
      const jwtResponse = await account.createJWT();
      const execution = await functions.createExecution("verify-admin", JSON.stringify({ jwt: jwtResponse.jwt, action, rowId }), false, "/", "POST");
      let result;
      try { result = JSON.parse(execution.responseBody || "{}"); } catch(e){ throw new Error("Invalid server response"); }
      if (execution.responseStatusCode < 200 || execution.responseStatusCode >= 300 || !result.success) throw new Error(result.message || "Admin request failed");
      return result;
    }

    async function verifyAdministrator() {
      try {
        await account.getSession("current");
        await runAdminAction("verify_admin");
        statusMessage.textContent = "Administrator verified. Loading...";
        return true;
      } catch(e){
        statusMessage.textContent = "Access denied. Redirecting...";
        try{ await account.deleteSession("current"); }catch(_){}
        setTimeout(()=> window.location.href="admin-login.html", 1200);
        return false;
      }
    }

    async function processApplication(rowId, action, btn){
      if(!confirm(`Are you sure you want to ${action} this application?`)) return;
      btn.disabled = true;
      try{
        const result = await runAdminAction(action, rowId);
        alert(action==="approve" ? `Approved! Membership ID: ${result.application?.membership_code}` : "Rejected successfully.");
        await loadApplications();
      }catch(e){ alert(e.message); btn.disabled=false; }
    }

    function renderTable(apps){
      applicationsList.innerHTML = "";
      if(apps.length===0){ applicationsList.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:20px;color:var(--muted)">No applications found.</td></tr>`; return; }
      apps.forEach(app=>{
        const tr = document.createElement("tr");
        const status = (app.status||"pending").toLowerCase();
        const date = app.$createdAt ? new Date(app.$createdAt).toISOString().slice(0,10) : "-";
        tr.innerHTML = `
          <td class="code-cell">${app.status === "approved" && app.membership_code ? app.membership_code : '<span style="color:#666">— No Code —</span>'}</td>
          <td>${app.full_name||"-"}</td>
          <td>${app.email||"-"}</td>
          <td>${app.phone||app.whatsapp||"-"}</td>
          <td>${app.date_of_birth||"-"}</td>
          <td>${app.gender||"-"}</td>
          <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${app.reason||""}">${app.reason||"-"}</td>
          <td class="status-${status}">${status}</td>
          <td>${date}</td>
          <td style="white-space:nowrap;">
            <button class="btn-approve">Approve</button>
            <button class="btn-reject">Reject</button>
          </td>
        `;
        const [approveBtn, rejectBtn] = tr.querySelectorAll("button");
        approveBtn.addEventListener("click", ()=> processApplication(app.$id, "approve", approveBtn));
        rejectBtn.addEventListener("click", ()=> processApplication(app.$id, "reject", rejectBtn));
        applicationsList.appendChild(tr);
      });
    }

    async function loadApplications(){
      const result = await runAdminAction("get_applications");
      allApps = result.applications || [];
      statusMessage.textContent = `Successfully loaded ${allApps.length} application(s).`;
      renderTable(allApps);
    }

    searchInput.addEventListener("input", ()=>{
      const q = searchInput.value.toLowerCase();
      renderTable(allApps.filter(a=> (a.full_name||"").toLowerCase().includes(q) || (a.email||"").toLowerCase().includes(q) || (a.membership_code||"").toLowerCase().includes(q)));
    });

    logoutButton.addEventListener("click", async ()=>{
      try{ await account.deleteSession("current"); }catch(e){}
      window.location.href="admin-login.html";
    });

    async function init(){
      if(!await verifyAdministrator()) return;
      try{ await loadApplications(); }catch(e){ statusMessage.textContent = e.message; }
    }
    init();
  </script>
</body>
</html>
