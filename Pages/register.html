<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership Application | Illumilight</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { background: #0a0a0a; color: #e8e0c8; font-family: 'Segoe UI', Arial, sans-serif; }
  .form-container { max-width: 700px; margin: 40px auto; background: #141410; padding: 35px; border-radius: 12px; border: 1px solid #2a2a1e; }
  h1 { color: #d4c98a; text-align: center; margin-bottom: 10px; }
  .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
  label { display: block; margin-top: 18px; color: #d4c98a; font-weight: 600; font-size: 14px; }
  input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; background: #1e1e1a; border: 1px solid #333; border-radius: 6px; color: #fff; box-sizing: border-box; }
  textarea { min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 15px; } .row > div { flex: 1; }
  .checkbox-group label { display: flex; gap: 10px; align-items: flex-start; color: #ccc; font-weight: 400; cursor: pointer; margin-top: 12px; }
  .checkbox-group input { width: auto; margin-top: 3px; }
  .btn-row { display: flex; justify-content: space-between; margin-top: 30px; gap: 15px; }
  .btn-back { padding: 14px 28px; background: transparent; border: 1px solid #d4c98a; color: #d4c98a; cursor: pointer; border-radius: 4px; }
  .btn-submit { padding: 14px 28px; background: #e8d98a; color: #000; border: none; font-weight: 700; cursor: pointer; border-radius: 4px; }
  .btn-submit:disabled { opacity: 0.6; }
  #message { text-align: center; margin-top: 20px; font-weight: 600; min-height: 20px; }
  #message.success { color: #8bc98a; } #message.error { color: #e57373; }
  .summary { background: #1a1a16; border: 1px solid #333; padding: 20px; border-radius: 8px; margin-top: 20px; display: none; }
  .summary p { margin: 8px 0; font-size: 14px; border-bottom: 1px solid #222; padding-bottom: 8px; }
  .summary b { color: #d4c98a; }
</style>
</head>
<body>
<div class="form-container">
  <h1>Membership Application</h1>
  <p class="subtitle">Illumilight — Official Application Form</p>
  <form id="registerForm">
    <div class="row">
      <div><label>First name *</label><input type="text" id="firstName" required placeholder="John"></div>
      <div><label>Last name *</label><input type="text" id="lastName" required placeholder="Doe"></div>
    </div>
    <div class="row">
      <div><label>Date of Birth *</label><input type="date" id="dob" required></div>
      <div><label>Gender *</label>
        <select id="gender" required>
          <option value="">Select Gender...</option>
          <option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label>Country *</label><input type="text" id="country" required placeholder="South Africa"></div>
      <div><label>City *</label><input type="text" id="city" required placeholder="Johannesburg"></div>
    </div>
    <label>Email *</label><input type="email" id="email" required placeholder="you@example.com">
    <label>Mobile *</label><input type="tel" id="phone" required placeholder="0821234567">
    <label>Preferred contact method</label>
    <select id="contactMethod"><option>Email</option><option>WhatsApp</option><option>Phone Call</option></select>
    <label>Occupation</label><input type="text" id="occupation" placeholder="e.g. Student, Engineer">
    <label>Why would you like to join Illuminati? *</label><textarea id="motivation" required placeholder="Tell us why..."></textarea>
    <label>How did you hear about us?</label><input type="text" id="hearAbout" placeholder="e.g. Friend, Google">
    <div class="checkbox-group">
      <label><input type="checkbox" id="confirm1" required> I confirm that the information provided is accurate.</label>
      <label><input type="checkbox" id="confirm2" required> I agree to the membership terms and privacy policy.</label>
    </div>
    <p style="font-size:12px;color:#888;margin-top:20px">Your application will be reviewed. Submission does not guarantee approval.</p>
    <div class="btn-row">
      <button type="button" class="btn-back" onclick="window.location.href='../index.html'">Back</button>
      <button type="submit" class="btn-submit" id="submitBtn">Submit application ↗</button>
    </div>
    <div id="message"></div>
    <div id="summaryBox" class="summary"></div>
  </form>
</div>

<script>
const PROJECT_ID = "6ae27aad00007b481204";
const DATABASE_ID = "illumilight-db";
const TABLE_ID = "membership_applications";

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('message');
  const summaryBox = document.getElementById('summaryBox');
  btn.disabled = true; btn.textContent = "Submitting..."; msg.textContent = "";

  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const fullName = firstName + ' ' + lastName;
  const dobVal = document.getElementById('dob').value;
  const genderVal = document.getElementById('gender').value;

  // Generate code like ILL-2026-0016
  const code = "ILL-2026-" + String(Math.floor(1000 + Math.random()*9000));

  const rowData = {
    full_name: fullName,
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    gender: genderVal,
    date_of_birth: dobVal,
    reason: document.getElementById('motivation').value.trim(),
    membership_code: code,
    status: "pending"
  };

  try {
    const res = await fetch(`https://fra.cloud.appwrite.io/v1/tablesdb/${DATABASE_ID}/tables/${TABLE_ID}/rows`, {
      method: 'POST',
      headers: { 'X-Appwrite-Project': PROJECT_ID, 'Content-Type': 'application/json' },
      body: JSON.stringify({ rowId: "unique()", data: rowData })
    });
    const data = await res.json();
    console.log(data);
    if(!res.ok) throw new Error(data.message || "Failed to submit");

    msg.className = "success";
    msg.textContent = `Application submitted successfully! Your Code: ${code}`;
    summaryBox.style.display = "block";
    summaryBox.innerHTML = `
      <p><b>Full Name:</b> ${fullName}</p>
      <p><b>DOB:</b> ${dobVal} | <b>Gender:</b> ${genderVal}</p>
      <p><b>Email:</b> ${rowData.email}</p>
      <p><b>Phone:</b> ${rowData.phone}</p>
      <p><b>Country:</b> ${document.getElementById('country').value} - ${document.getElementById('city').value}</p>
      <p><b>Reason:</b> ${rowData.reason}</p>
      <p style="color:#8bc98a"><b>Your Membership Code:</b> ${code} (Pending approval)</p>
    `;
    document.getElementById('registerForm').reset();
  } catch(err){
    console.error(err);
    msg.className = "error";
    msg.textContent = "Unable to submit: " + err.message + " — Turn VPN OFF and try again.";
  } finally {
    btn.disabled = false; btn.textContent = "Submit application ↗";
  }
});
</script>
</body>
</html>
