<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Illumilight</title>
<link rel="stylesheet" href="../style.css">
<style>
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding:20px;max-width:1100px;margin:0 auto}
.product-card{background:#13120f;border:1px solid #2a251c;border-radius:4px;overflow:hidden}
.product-card img{width:100%;height:220px;object-fit:cover}
.product-info{padding:18px}
.product-info h3{font-family:Cinzel,serif;color:#fff;margin:0}
.product-info p{color:#999;font-size:13px;min-height:36px}
.price{color:#d6b36a;font-weight:700;font-size:18px;margin:10px 0}
.buy-btn{width:100%;padding:12px;background:#d6b36a;border:none;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header class="navbar">
  <a href="../index.html" class="brand"><img src="../images/illumilight-logo.png" class="brand-logo"></a>
  <nav class="nav-links">
    <a href="../index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="login.html">Member Login</a>
  </nav>
</header>

<h1 style="text-align:center;font-family:Cinzel;color:#fff;margin-top:40px">ILLUMILIGHT <span style="color:#d6b36a">STORE</span></h1>
<p style="text-align:center;color:#888;font-size:12px;letter-spacing:2px">LIVE FROM APPWRITE DATABASE</p>

<div id="shopGrid" class="shop-grid"><p style="color:#888;text-align:center">Loading products...</p></div>

<script>
const PROJECT_ID = "6ae27aad00007b481204";
const DATABASE_ID = "illumilight-db";
const TABLE_ID = "6afb96090029e4927ee3";

async function loadProducts(){
  const grid = document.getElementById('shopGrid');
  try{
    const res = await fetch(`https://fra.cloud.appwrite.io/v1/tablesdb/${DATABASE_ID}/tables/${TABLE_ID}/rows`, {
      headers: { 'X-Appwrite-Project': PROJECT_ID }
    });
    const data = await res.json();
    const rows = data.rows || data.documents || [];
    
    if(rows.length===0){ grid.innerHTML = '<p style="color:#888">No products yet. Add some in Appwrite.</p>'; return; }

    grid.innerHTML = rows.map(p => `
      <div class="product-card">
        <img src="${p.image || 'https://via.placeholder.com/400x400?text=ILLUMILIGHT'}">
        <div class="product-info">
          <span style="color:#d6b36a;font-size:10px;letter-spacing:2px">${(p.category||'ILLUMILIGHT').toUpperCase()}</span>
          <h3>${p.name}</h3>
          <p>${p.description||''}</p>
          <div class="price">R ${p.price}</div>
          <div style="font-size:11px;color:${p.stock>0?'#8bc98a':'#e57373'}">${p.stock>0 ? p.stock+' in stock' : 'Out of stock'}</div>
          <button class="buy-btn" onclick="buyProduct('${p.name}', ${p.price})" style="margin-top:12px">BUY NOW ↗</button>
        </div>
      </div>
    `).join('');
  }catch(e){
    grid.innerHTML = 'Error loading: ' + e.message;
  }
}
function buyProduct(name, price){
  const msg = `Hi Illumilight! I want to buy: ${name} - R${price}`;
  window.open(`https://wa.me/19304651058?text=${encodeURIComponent(msg)}`, '_blank');
}
loadProducts();
</script>
</body>
</html>
