<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media & Stories | Illuminati</title>
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../dodis.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{background:#050000!important}
.media-hero{padding:40px 16px 10px;text-align:center;background:#050000}
.media-hero h1{font-family:Cinzel,serif;font-size:42px;color:#e8d27a;letter-spacing:2px;line-height:1.05}
.media-hero p{color:#9a9a9a;font-size:14px;margin-top:10px}
.media-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:18px 14px}
.media-tabs button{background:#111;border:1px solid #2a2a2a;color:#ccc;padding:10px 22px;border-radius:30px;font-size:14px;cursor:pointer}
.media-tabs button.active{background:#e8d27a;color:#000;font-weight:700;border-color:#e8d27a}
#mediaGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 14px 100px;background:#050000}
.media-card{border-radius:18px;overflow:hidden;background:#0e0e0e;border:1px solid #222;position:relative}
.media-card img{width:100%;height:180px;object-fit:cover;display:block}
.media-card video{width:100%;height:220px;object-fit:cover;display:block;background:#000}
.media-card .m-info{padding:10px 12px}
.media-card .m-info b{font-size:13px;color:#fff;display:block}
.media-card .m-info small{font-size:11px;color:#888}
.testi-card{grid-column:span 2;background:#0d0d00;border:1px solid #3a3000;border-radius:18px;padding:18px}
.testi-card p{color:#e8d27a;font-style:italic;font-size:14px;line-height:1.6}
.testi-card b{color:#fff;font-size:12px}
</style></head>
<body>
<header class="navbar" style="background:#050000;border-bottom:1px solid #222;">
<a href="../index.html" class="brand"><img src="../images/illumilight-logo.png" class="brand-logo" alt="Illumilight"></a>
<input type="checkbox" id="nav-toggle"><label for="nav-toggle" class="hamburger">☰</label>
<nav class="nav-links"><a href="../index.html">Home</a><a href="dodis.html">DODIS</a><a href="media.html">Media</a><a href="community.html">Community</a><a href="login.html">Member Login</a></nav>
</header>

<main>
<section class="media-hero">
<div style="color:#e8d27a;font-size:10px;letter-spacing:4px;">✦ ILLUMINATI DISCOVER ✦</div>
<h1>MEDIA &<br>STORIES</h1>
<p>Images, videos and testimonies from our<br>community and DODIS distribution.</p>
</section>

<div class="media-tabs">
<button class="m-filter active" data-filter="all">All</button>
<button class="m-filter" data-filter="images">Images</button>
<button class="m-filter" data-filter="videos">Videos</button>
<button class="m-filter" data-filter="testimonies">Testimonies</button>
</div>

<div id="mediaGrid"></div>

<div style="text-align:center;padding:20px;"><a href="../index.html" style="color:#e8d27a;text-decoration:none;font-size:16px;">← Back to Home</a></div>
</main>

<footer class="footer" style="background:#050000;border-top:1px solid #222;">
<a href="../index.html" class="footer-brand">illum<span style="color:#e8d27a;">light</span></a>
<p>© <span id="year"></span> ILLUMINATI • DODIS Department of Distribution</p>
</footer>

<script>
const PROJECT_ID="6ae27aad00007b481204";const BUCKET_ID="6aff738b001323f8ed0d";const ENDPOINT="https://fra.cloud.appwrite.io/v1";
function sUrl(id){return`${ENDPOINT}/storage/buckets/${BUCKET_ID}/files/${id}/view?project=${PROJECT_ID}`;}

// YOUR CONTENT - EDIT HERE TO ADD MORE!
const MEDIA_ITEMS=[
  {type:"images", title:"Testament - Front", desc:"DODIS Edition • R750", img:"YOUR_FILE_ID_1"},
  {type:"images", title:"Testament - Detail", desc:"Inside pages", img:"YOUR_FILE_ID_2"},
  {type:"images", title:"Community Drop JHB", desc:"Johannesburg distribution", img:"YOUR_FILE_ID_3"},
  {type:"videos", title:"Unboxing the Testament", desc:"Member review", video:"https://www.w3schools.com/html/mov_bbb.mp4"},
  {type:"videos", title:"DODIS Explained", desc:"What is DODIS?", video:"https://www.w3schools.com/html/mov_bbb.mp4"},
  {type:"testimonies", quote:"I got my Testament in 2 days in Soweto. Quality is insane, packaging is next level. This is not just a book.", name:"Thabo M. • Soweto • Verified"},
  {type:"testimonies", quote:"ILL-2026 member price R650 saved me. The community is real.", name:"Sarah K. • Cape Town • Member"},
];

let activeM="all";
const grid=document.getElementById("mediaGrid");
function renderMedia(){
  const list=MEDIA_ITEMS.filter(m=>activeM==="all"||m.type===activeM);
  if(list.length===0){grid.innerHTML=`<p style="grid-column:span 2;text-align:center;color:#777;padding:30px;">No ${activeM} yet. Upload in Appwrite Storage.</p>`;return;}
  grid.innerHTML=list.map(m=>{
    if(m.type==="testimonies") return`<div class="testi-card"><p>"${m.quote}"</p><b>⛧ ${m.name}</b></div>`;
    if(m.type==="videos") return`<div class="media-card"><video controls poster=""><source src="${m.video}"></video><div class="m-info"><b>${m.title}</b><small>${m.desc}</small></div></div>`;
    const src=m.img.startsWith("http")?m.img:(m.img.includes("YOUR_")?"../images/illumilight-logo.png":sUrl(m.img));
    return`<div class="media-card"><img src="${src}"><div class="m-info"><b>${m.title}</b><small>${m.desc}</small></div></div>`;
  }).join("");
}
document.querySelectorAll(".m-filter").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".m-filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeM=b.dataset.filter;renderMedia();}));
renderMedia();
document.getElementById("year").textContent=new Date().getFullYear();

// Auto-load images from Appwrite Storage bucket too
async function loadBucketImages(){
  try{
    const res=await fetch(`${ENDPOINT}/storage/buckets/${BUCKET_ID}/files?project=${PROJECT_ID}`);
    const data=await res.json();
    if(data.files && data.files.length){
      data.files.forEach(f=>{
        if(!MEDIA_ITEMS.find(m=>m.img===f.$id)){
          MEDIA_ITEMS.unshift({type:"images", title:f.name, desc:"From DODIS Vault", img:f.$id});
        }
      });
      renderMedia();
    }
  }catch(e){}
}
loadBucketImages();
</script>
</body></html>
