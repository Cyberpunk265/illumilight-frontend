<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login | Illumilight</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { background: #0a0a0a; color: #e8e0c8; font-family: 'Segoe UI', Arial, sans-serif; }
  .login-container { max-width: 500px; margin: 50px auto; background: #141410; padding: 35px; border-radius: 12px; border: 1px solid #2a2a1e; text-align: center; }
  h1 { color: #d4c98a; margin-bottom: 8px; font-size: 28px; letter-spacing: 2px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }
  label { display: block; text-align: left; margin-top: 18px; color: #d4c98a; font-weight: 600; font-size: 14px; }
  input { width: 100%; padding: 13px; margin-top: 6px; background: #1e1e1a; border: 1px solid #333; border-radius: 6px; color: #fff; box-sizing: border-box; text-transform: uppercase; }
  input::placeholder { text-transform: none; }
  #emailInput { text-transform: none; }
  .btn-login { width: 100%; padding: 14px; margin-top: 25px; background: #e8d98a; color: #000; border: none; font-weight: 700; cursor: pointer; border-radius: 6px; font-size: 15px; }
  .btn-login:disabled { opacity: 0.6; }
  .btn-back { margin-top: 12px; background: transparent; border: 1px solid #555; color: #aaa; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; }
  #result { margin-top: 25px; text-align: left; display: none; }
  .status-card { background: #1a1a16; border: 1px solid #333; padding: 20px; border-radius: 10px; }
  .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; text-transform: uppercase; }
  .status-pending { background: #3a2f00; color: #e8d98a; border: 1px solid #e8d98a; }
  .status-approved { background: #0f2e0f; color: #8bc98a; border: 1px solid #8bc98a; }
  .status-rejected { background: #3a0f0f; color: #e57373; border: 1px solid #e57373; }
  .member-card { background: linear-gradient(135deg, #1a1a10, #2a2410); border: 1px solid #d4c98a; padding: 22px; border-radius: 10px; margin-top: 15px; text-align: center; }
  .member-card h3 { color: #d4c98a; margin: 0; letter-spacing: 3px; font-size: 13px; }
  .member-code { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 1px; margin: 10px 0; }
  .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 14px; }
  .detail-row b { color: #d4c98a; }
  #errorMsg { color: #e57373; margin-top: 15px; font-weight: 600; display: none; }
  .hint { font-size: 12px; color: #666; margin-top: 20px; }
  #downloadBtn { display: none; width: 100%; padding: 14px; margin-top: 18px; background: linear-gradient(135deg, #d4c98a, #a8984a); color: #000; border: none; font-weight: 800; border-radius: 8px; cursor: pointer; font-size: 14px; letter-spacing: 0.5px; }
  #cardPreview { display: none; margin-top: 15px; border-radius: 10px; overflow: hidden; }
  #cardPreview canvas { width: 100%; border-radius: 10px; border: 1px solid #d4c98a; }
</style>
</head>
<body>
<div class="login-container">
  <h1>✦ ILLUMILIGHT</h1>
  <p class="subtitle">Member Status Check</p>

  <form id="loginForm">
    <label>Membership Code *</label>
    <input type="text" id="codeInput" required placeholder="ILL-2026-XXXX">
    <label>Email (optional)</label>
    <input type="email" id="emailInput" placeholder="you@example.com">
    <button type="submit" class="btn-login" id="loginBtn">Check Status →</button>
    <button type="button" class="btn-back" onclick="window.location.href='../index.html'">← Back to Home</button>
  </form>

  <div id="errorMsg"></div>

  <div id="result">
    <div class="status-card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="color:#888;font-size:13px;">APPLICATION STATUS</span>
        <span id="statusBadge" class="status-badge status-pending">Pending</span>
      </div>
      <div class="member-card">
        <h3>ILLUMILIGHT MEMBER</h3>
        <div class="member-code" id="displayCode">ILL-2026-XXXX</div>
        <div id="displayName" style="color:#e8e0c8;font-weight:600;">-</div>
      </div>
      <div style="margin-top:15px;">
        <div class="detail-row"><span>Full Name</span><b id="dName">-</b></div>
        <div class="detail-row"><span>Email</span><b id="dEmail">-</b></div>
        <div class="detail-row"><span>Gender</span><b id="dGender">-</b></div>
        <div class="detail-row"><span>DOB</span><b id="dDob">-</b></div>
        <div class="detail-row"><span>Country / City</span><b id="dCountry">-</b></div>
        <div class="detail-row"><span>Status</span><b id="dStatus">-</b></div>
      </div>
      <p id="statusMessage" style="font-size:13px;color:#aaa;margin-top:15px;line-height:1.5;"></p>
      <button id="downloadBtn">⬇ DOWNLOAD GOLD MEMBER CARD</button>
      <div id="cardPreview"><canvas id="memberCanvas" width="800" height="480"></canvas></div>
    </div>
  </div>
  <p class="hint">Lost your code? Check your email after registration or contact support.<br>Codes are format ILL-2026-XXXX</p>
</div>

<script>
const PROJECT_ID = "6ae27aad00007b481204";
const DATABASE_ID = "illumilight-db";
const TABLE_ID = "membership_applications";
let currentMember = null;

function getCountryDisplay(m){
  // Fix for old rows: try many possible field names
  const country = m.country || m.country_of_residence || m.nationality || "";
  const city = m.city || m.town || "";
  const combined = (country + " " + city).trim();
  if(combined) return combined;
  if(m.address) return m.address;
  return "Not provided - old application";
}

function drawGoldCard(member){
  const canvas = document.getElementById('memberCanvas');
  const ctx = canvas.getContext('2d');
  // Background
  const grad = ctx.createLinearGradient(0,0,800,480);
  grad.addColorStop(0,'#0f0f0a'); grad.addColorStop(0.5,'#1a1a0e'); grad.addColorStop(1,'#2a2410');
  ctx.fillStyle = grad; ctx.fillRect(0,0,800,480);
  // Gold border
  ctx.strokeStyle = '#d4c98a'; ctx.lineWidth = 4; ctx.strokeRect(15,15,770,450);
  ctx.strokeStyle = 'rgba(212,201,138,0.3)'; ctx.lineWidth = 1; ctx.strokeRect(30,30,740,420);
  // Top
  ctx.fillStyle = '#d4c98a'; ctx.font = '600 24px Cinzel, serif'; ctx.textAlign = 'center';
  ctx.fillText('✦  ILLUMILIGHT  ✦', 400, 85);
  ctx.font = '300 13px Arial'; ctx.fillStyle = '#888'; ctx.fillText('FIND YOUR LIGHT  •  EST. ILLUMILIGHT', 400, 110);
  // Name
  ctx.fillStyle = '#fff'; ctx.font = '700 42px Arial'; ctx.fillText((member.full_name||'').toUpperCase(), 400, 210);
  ctx.fillStyle = '#d4c98a'; ctx.font = '600 16px Arial'; ctx.fillText('OFFICIAL MEMBER', 400, 240);
  // Code box
  ctx.fillStyle = '#e8d98a'; ctx.fillRect(200, 270, 400, 60);
  ctx.fillStyle = '#000'; ctx.font = '800 30px monospace'; ctx.fillText(member.membership_code || '', 400, 310);
  // Bottom details
  ctx.fillStyle = '#aaa'; ctx.font = '14px Arial'; ctx.textAlign = 'left';
  ctx.fillText('Gender: ' + (member.gender||'-'), 60, 380);
  ctx.fillText('DOB: ' + (member.date_of_birth||'-'), 60, 405);
  ctx.textAlign = 'right';
  ctx.fillText('Status: ' + (member.status||'').toUpperCase(), 740, 380);
  ctx.fillText(getCountryDisplay(member), 740, 405);
  ctx.textAlign = 'center'; ctx.fillStyle = '#666'; ctx.font = '11px Arial';
  ctx.fillText('This card is your official Illumilight membership identification. Keep it safe.', 400, 435);
  document.getElementById('cardPreview').style.display = 'block';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorMsg');
  const result = document.getElementById('result');
  const dlBtn = document.getElementById('downloadBtn');
  btn.disabled = true; btn.textContent = "Checking...";
  err.style.display = "none"; result.style.display = "none"; dlBtn.style.display = "none";
  document.getElementById('cardPreview').style.display = "none";

  try {
    const query = encodeURIComponent(`equal("membership_code", "${code}")`);
    const res = await fetch(`https://fra.cloud.appwrite.io/v1/tablesdb/${DATABASE_ID}/tables/${TABLE_ID}/rows?queries[]=${query}&limit=5`, {
      headers: { 'X-Appwrite-Project': PROJECT_ID }
    });
    const data = await res.json();
    let rows = data.rows || data.documents || [];
    if(rows.length === 0){
      const res2 = await fetch(`https://fra.cloud.appwrite.io/v1/tablesdb/${DATABASE_ID}/tables/${TABLE_ID}/rows?limit=100`, {
        headers: { 'X-Appwrite-Project': PROJECT_ID }
      });
      const data2 = await res2.json();
      const all = data2.rows || data2.documents || [];
      rows = all.filter(r => (r.membership_code||"").toUpperCase() === code);
    }
    if(rows.length === 0) throw new Error("No member found with code " + code + ". Check spelling.");
    let member = rows[0];
    currentMember = member;
    if(email && member.email && member.email.toLowerCase() !== email){
      throw new Error("Email does not match this membership code.");
    }

    const statusRaw = (member.status || "Pending").toLowerCase();
    const badge = document.getElementById('statusBadge');
    badge.textContent = member.status || "Pending";
    badge.className = "status-badge " + (statusRaw.includes("approv") ? "status-approved" : statusRaw.includes("reject") ? "status-rejected" : "status-pending");

    document.getElementById('displayCode').textContent = member.membership_code || code;
    document.getElementById('displayName').textContent = member.full_name || "-";
    document.getElementById('dName').textContent = member.full_name || "-";
    document.getElementById('dEmail').textContent = member.email || "-";
    document.getElementById('dGender').textContent = member.gender || "-";
    document.getElementById('dDob').textContent = member.date_of_birth || "-";
    document.getElementById('dCountry').textContent = getCountryDisplay(member);
    document.getElementById('dStatus').textContent = member.status || "Pending";

    const msg = document.getElementById('statusMessage');
    if(statusRaw.includes("approv")){
      msg.textContent = "🎉 Congratulations! Your membership has been approved. Welcome to Illumilight. Download your gold member card below.";
      dlBtn.style.display = "block";
      drawGoldCard(member);
    } else if(statusRaw.includes("reject")){
      msg.textContent = "Your application was not approved at this time. You may re-apply or contact support.";
    } else {
      msg.textContent = "Your application is under review. Please check back in 24-48 hours. You will see Approved here once reviewed.";
    }
    result.style.display = "block";
  } catch(error){
    err.textContent = error.message;
    err.style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "Check Status →";
  }
});

document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const canvas = document.getElementById('memberCanvas');
  const link = document.createElement('a');
  link.download = (currentMember ? currentMember.membership_code : 'ILLUMILIGHT') + '-card.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>
</body>
</html>
