<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illumilight Admin</title>
<style>
  body { background:#0a0a0a; color:#e8e0c8; font-family:Arial; margin:0; padding:20px; }
  h1 { color:#d4c98a; }
  .topbar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  button { padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:700; border:none; }
  .btn-refresh { background:#d4c98a; color:#000; }
  .btn-clean { background:#ff3b3b; color:#fff; }
  .table-wrap { overflow-x:auto; border:1px solid #333; border-radius:8px; }
  table { width:100%; border-collapse:collapse; min-width:1100px; }
  th { background:#1a1a10; color:#d4c98a; padding:12px; text-align:left; font-size:13px; }
  td { padding:11px; border-bottom:1px solid #222; font-size:13px; }
  tr:hover { background:#141410; }
  /* STICKY ACTIONS - THIS IS THE FIX */
  th:last-child, td:last-child {
    position: sticky; right: 0;
    background:#1e1a10; min-width:190px;
    box-shadow: -10px 0 15px rgba(0,0,0,0.7);
  }
  .code { color:#e8d98a; font-weight:700; }
  .btn-approve { background:#22c55e; color:#fff; padding:8px 14px; font-size:12px; margin-right:5px; border-radius:5px; }
  .btn-reject { background:#ef4444; color:#fff; padding:8px 14px; font-size:12px; border-radius:5px; }
  .status-approved { color:#8bc98a; font-weight:700; }
  .status-pending { color:#e8d98a; font-weight:700; }
  .status-rejected { color:#e57373; font-weight:700; }
  .dup-badge { background:#ff3b3b; color:#fff; font-size:10px; padding:2px 6px; border-radius:3px; display:inline-block; margin-top:4px; }
  #loginBox { max-width:400px; margin:100px auto; text-align:center; background:#141410; padding:30px; border-radius:10px; border:1px solid #333; }
  #loginBox input { width:100%; padding:12px; margin:10px 0; background:#1e1e1a; border:1px solid #333; color:#fff; border-radius:6px; box-sizing:border-box; }
  #loginBox button { width:100%; background:#e8d98a; color:#000; }
  #searchInput { flex:1; padding:12px; background:#1e1e1a; border:1px solid #333; color:#fff; border-radius:6px; min-width:200px; }
</style>
</head>
<body>

<div id="loginBox">
  <h1>✦ ILLUMILIGHT ADMIN</h1>
  <p>Enter admin password</p>
  <input type="password" id="adminPass" placeholder="Password">
  <button onclick="checkPass()">Login</button>
  <p id="loginErr" style="color:red"></p>
</div>

<div id="adminContent" style="display:none">
  <h1 id="title">Members - 0 | Pending: 0</h1>
  <div class="topbar">
    <input id="searchInput" placeholder="Search name, code, email..." oninput="renderTable()">
    <button class="btn-refresh" onclick="loadData()">Refresh</button>
    <button class="btn-clean" onclick="deleteDuplicates()">Delete All Duplicates (keep first)</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Code</th><th>Full Name</th><th>Email</th><th>Phone</th><th>DOB</th><th>Gender</th><th>Reason</th><th>Status</th><th>Date</th><th>Actions</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const PROJECT_ID = "6ae27aad00007b481204";
const DATABASE_ID = "illumilight-db";
const TABLE_ID = "membership_applications";
const ENDPOINT = "https://fra.cloud.appwrite.io/v1";
let allRows = [];

function checkPass(){
  if(document.getElementById('adminPass').value === "HORROR65"){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminContent').style.display='block';
    loadData();
  } else { document.getElementById('loginErr').innerText="Wrong password"; }
}

async function loadData(){
  const res = await fetch(`${ENDPOINT}/tablesdb/${DATABASE_ID}/tables/${TABLE_ID}/rows?queries[]=${encodeURIComponent('orderDesc("$createdAt")')}&queries[]=${encodeURIComponent('limit(100)')}`, {
    headers: { 'X-Appwrite-Project': PROJECT_ID }
  });
  const data = await res.json();
  allRows = data.rows || data.documents || [];
  renderTable();
}

function renderTable(){
  const q = (document.getElementById('searchInput').value||"").toLowerCase();
  const seen = new Set();
  let pending = 0;
  let html = "";
  let filtered = allRows.filter(r=>{
    const d=r.data||r;
    return ((d.code||"")+(d.fullname||"")+(d.email||"")).toLowerCase().includes(q);
  });
  filtered.forEach(r=>{
    const d=r.data||r; const id=r.$id||r._id;
    if((d.status||"pending")==="pending") pending++;
    const isDup = seen.has((d.email||"").toLowerCase()+(d.code||""));
    seen.add((d.email||"").toLowerCase()+(d.code||""));
    // duplicate check by email only too
    html += `<tr>
      <td><span class="code">${d.code||"Optional"}</span>${isDup?'<br><span class="dup-badge">DUPLICATE</span>':''}</td>
      <td>${d.fullname||"-"}</td><td>${d.email||""}</td><td>${d.phone||""}</td><td>${d.dob||""}</td><td>-</td><td>${(d.reason||"").substring(0,20)}</td>
      <td class="status-${d.status}">${d.status||"pending"}</td>
      <td>${(r.$createdAt||"").substring(0,10)}</td>
      <td><button class="btn-approve" onclick="updateStatus('${id}','approved')">Approve</button><button class="btn-reject" onclick="updateStatus('${id}','rejected')">Reject</button></td>
    </tr>`;
  });
  document.getElementById('tbody').innerHTML = html;
  document.getElementById('title').innerText = `Members - ${allRows.length} | Pending: ${pending}`;
}

async function updateStatus(id, status){
  await fetch(`${ENDPOINT}/tablesdb/${DATABASE_ID}/tables/${TABLE_ID}/rows/${id}`, {
    method:'PATCH',
    headers:{ 'X-Appwrite-Project': PROJECT_ID, 'Content-Type':'application/json' },
    body: JSON.stringify({ data:{ status } })
  });
  alert("Updated to "+status);
  loadData();
}

async function deleteDuplicates(){
  if(!confirm("Delete duplicates?")) return;
  const seenEmail = new Set();
  for(let r of allRows){
    const d=r.data||r; const id=r.$id;
    const key=(d.email||"").toLowerCase();
    if(seenEmail.has(key)){
      await fetch(`${ENDPOINT}/tablesdb/${DATABASE_ID}/tables/${TABLE_ID}/rows/${id}`, { method:'DELETE', headers:{ 'X-Appwrite-Project': PROJECT_ID } });
    } else seenEmail.add(key);
  }
  loadData();
}
</script>
</body>
</html>
