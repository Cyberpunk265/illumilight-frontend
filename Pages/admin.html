<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illumilight Admin</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px}
h1{color:#d4af37}
input{padding:12px;background:#222;color:#fff;border:1px solid #444;border-radius:5px}
button{padding:8px 14px;border:none;border-radius:5px;font-weight:bold;cursor:pointer;margin:2px}
.btn-green{background:#4caf50;color:#fff}.btn-red{background:#e53935;color:#fff}.btn-grey{background:#444;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:12px}
th,td{border:1px solid #333;padding:8px;text-align:left}
th{background:#1a1a1a;color:#d4af37}
.dup{background:#3a1a1a !important}
.badge{background:#e53935;color:#fff;padding:2px 6px;border-radius:3px;font-size:10px}
</style>
</head>
<body>
<div id="loginBox" style="max-width:400px;margin:100px auto;background:#111;padding:30px;border-radius:10px;text-align:center;border:1px solid #d4af37">
<h1>Illumilight Admin</h1>
<input type="password" id="pw" placeholder="Password" style="width:90%">
<button onclick="login()" style="background:#d4af37;color:#000;padding:12px 25px;margin-top:10px">Login</button>
<p id="err" style="color:red"></p>
</div>
<div id="main" style="display:none">
<h1>Members - <span id="count">0</span> | Pending: <span id="pendingCount">0</span></h1>
<input id="search" placeholder="Search name, code, email..." onkeyup="filterT()" style="width:300px">
<button onclick="loadData()" style="background:#d4af37">Refresh</button>
<button onclick="deleteDuplicates()" style="background:#e53935;color:#fff">Delete All Duplicates (keep first)</button>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Code</th><th>Full Name</th><th>Email</th><th>Phone</th><th>DOB</th><th>Gender</th><th>Reason</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<p id="debug" style="color:#888;font-size:11px"></p>
</div>
<script>
const PROJECT_ID="6ae27aad00007b481204";
const DATABASE_ID="illumilight-db";
const TABLE_ID="membership_applications";
const BASE=`https://fra.cloud.appwrite.io/v1/tablesdb/${DATABASE_ID}/tables/${TABLE_ID}/rows`;
function login(){ if(document.getElementById('pw').value==='illumi2026'){document.getElementById('loginBox').style.display='none';document.getElementById('main').style.display='block';loadData();} else document.getElementById('err').textContent='Wrong password';}
let allDocs=[];
async function loadData(){
 document.getElementById('tbody').innerHTML='<tr><td colspan=10>Loading...</td></tr>';
 try{
  const res=await fetch(BASE,{headers:{'X-Appwrite-Project':PROJECT_ID}});
  const data=await res.json();
  document.getElementById('debug').textContent='Status: '+res.status+' - Total: '+(data.total||0);
  allDocs=data.rows||[];
  render(allDocs);
 }catch(e){document.getElementById('tbody').innerHTML='<tr><td colspan=10>Error: '+e.message+'</td></tr>';}
}
function getEmailCount(email){return allDocs.filter(d=>(d.email||'').toLowerCase()===email.toLowerCase()).length;}
function render(docs){
 document.getElementById('count').textContent=docs.length;
 document.getElementById('pendingCount').textContent=docs.filter(d=>(d.status||'pending')==='pending').length;
 document.getElementById('tbody').innerHTML=docs.map(d=>{
  const isDup=getEmailCount(d.email||'')>1;
  const gender=d.gender||d.Gender||'-';
  return `<tr class="${isDup?'dup':''}">
  <td><b style="color:#d4af37">${d.membership_code||d.membershipCode||'Optional'}</b> ${isDup?'<span class="badge">DUPLICATE</span>':''}</td>
  <td>${d.full_name||d.fullName||((d.firstName||'')+' '+(d.lastName||''))}</td>
  <td>${d.email||''}</td><td>${d.phone||''}</td><td>${d.date_of_birth||d.dob||''}</td>
  <td><b>${gender}</b></td>
  <td>${d.reason||d.motivation||''}</td><td>${d.status||'pending'}</td>
  <td>${d.$createdAt?new Date(d.$createdAt).toLocaleDateString():''}</td>
  <td style="white-space:nowrap">
   <button class="btn-green" onclick="setStatus('${d.$id}','approved')">Approve</button>
   <button class="btn-red" onclick="setStatus('${d.$id}','rejected')">Reject</button>
   <button class="btn-grey" onclick="deleteRow('${d.$id}','${(d.full_name||'').replace(/'/g,'')}')">Delete</button>
  </td></tr>`;
 }).join('');
}
async function setStatus(id,status){
 if(!confirm('Set to '+status+'?'))return;
 await fetch(`${BASE}/${id}`,{method:'PATCH',headers:{'X-Appwrite-Project':PROJECT_ID,'Content-Type':'application/json'},body:JSON.stringify({data:{status:status}})});
 loadData();
}
async function deleteRow(id,name){
 if(!confirm('Delete '+name+'?'))return;
 await fetch(`${BASE}/${id}`,{method:'DELETE',headers:{'X-Appwrite-Project':PROJECT_ID}});
 loadData();
}
async function deleteDuplicates(){
 if(!confirm('Delete duplicates and keep first of each email?'))return;
 const seen={};
 for(let d of allDocs){
  const em=(d.email||'').toLowerCase();
  if(seen[em]){ await fetch(`${BASE}/${d.$id}`,{method:'DELETE',headers:{'X-Appwrite-Project':PROJECT_ID}}); }
  else seen[em]=1;
 }
 loadData();
}
function filterT(){const q=document.getElementById('search').value.toLowerCase();render(allDocs.filter(d=>JSON.stringify(d).toLowerCase().includes(q)));}
</script>
</body>
</html>
