<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illumilight Admin</title>
<style>
  body { background:#0a0a0a; color:#e8e0c8; font-family:Arial,sans-serif; margin:0; padding:20px; }
  h1 { color:#d4c98a; font-size:28px; }
  .topbar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  button { padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:700; border:none; }
  .btn-refresh { background:#d4c98a; color:#000; }
  .btn-clean { background:#333; color:#aaa; }
  .table-wrap { overflow-x:auto; border:1px solid #333; border-radius:8px; background:#111; }
  table { width:100%; border-collapse:collapse; min-width:1100px; }
  th { background:#1a1a10; color:#d4c98a; padding:12px; text-align:left; font-size:13px; }
  td { padding:11px; border-bottom:1px solid #222; font-size:13px; vertical-align:top; }
  tr:hover { background:#141410; }
  /* STICKY ACTIONS */
  th:last-child, td:last-child {
    position: sticky; right: 0;
    background:#1e1a10; min-width:200px;
    box-shadow: -12px 0 15px rgba(0,0,0,0.8);
  }
  .code { color:#e8d98a; font-weight:700; }
  .btn-approve { background:#22c55e; color:#fff; padding:8px 14px; font-size:12px; margin-right:5px; border-radius:5px; border:none; cursor:pointer; }
  .btn-reject { background:#ef4444; color:#fff; padding:8px 14px; font-size:12px; border-radius:5px; border:none; cursor:pointer; }
  .status-approved { color:#4ade80; font-weight:700; }
  .status-pending { color:#e8d98a; font-weight:700; }
  .status-rejected { color:#f87171; font-weight:700; }
  #loginBox { max-width:400px; margin:100px auto; text-align:center; background:#141410; padding:30px; border-radius:10px; border:1px solid #333; }
  #loginBox input { width:100%; padding:12px; margin:10px 0; background:#1e1e1a; border:1px solid #333; color:#fff; border-radius:6px; box-sizing:border-box; }
  #loginBox button { width:100%; background:#e8d98a; color:#000; padding:12px; }
  #searchInput { flex:1; padding:12px; background:#1e1e1a; border:1px solid #333; color:#fff; border-radius:6px; min-width:200px; }
  .debug { font-size:11px; color:#888; margin-top:10px; }
</style>
</head>
<body>

<div id="loginBox">
  <h1>✦ ILLUMILIGHT ADMIN</h1>
  <p>Enter admin password</p>
  <input type="password" id="adminPass" placeholder="Password">
  <button onclick="checkPass()">Login</button>
  <p id="loginErr" style="color:red"></p>
  <p style="font-size:12px;color:#666">Hint: Illumilight2026</p>
</div>

<div id="adminContent" style="display:none">
  <h1 id="title">Members - Loading...</h1>
  <div class="topbar">
    <input id="searchInput" placeholder="Search name, code, email..." oninput="renderTable()">
    <button class="btn-refresh" onclick="loadData()">🔄 Refresh</button>
    <button class="btn-clean" onclick="alert('Duplicates cleaning disabled for safety')">Duplicates Safe</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Code</th><th>Full Name</th><th>Email</th><th>Phone</th><th>DOB</th><th>Gender</th><th>Reason</th><th>Status</th><th>Date</th><th>Actions</th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="10">Loading...</td></tr></tbody>
    </table>
  </div>
  <p class="debug" id="debugText"></p>
</div>

<script>
const PROJECT_ID = "6ae27aad00007b481204";
const DATABASE_ID = "illumilight-db";
const TABLE_ID = "membership_applications";
const ENDPOINT = "https://fra.cloud.appwrite.io/v1";
let allRows = [];

function checkPass(){
  const val = document.getElementById('adminPass').value.trim();
  if(val === "Illumilight2026" || val === "admin123"){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminContent').style.display='block';
    loadData();
  } else { 
    document.getElementById('loginErr').innerText="Wrong password - try Illumilight2026";
  }
}

// Allow Enter key
document.getElementById('adminPass').addEventListener('keypress', function(e){ if(e.key==='Enter') checkPass(); });

async function loadData(){
  document.getElementById('title').innerText = "Members - Loading...";
  try {
    const url = `${ENDPOINT}/tablesdb/${DATABASE_ID}/tables/${TABLE_ID}/rows?limit=100`;
    console.log("Fetching:", url);
    const res = await fetch(url, {
      headers: { 'X-Appwrite-Project': PROJECT_ID }
    });
    const data = await res.json();
    console.log("DATA:", data);
    document.getElementById('debugText').innerText = "Raw response: " + JSON.stringify(data).substring(0,300);
    allRows = data.rows || data.documents || [];
    // if tablesdb fails, try old databases API
    if(allRows.length===0 && data.message){
      const res2 = await fetch(`${ENDPOINT}/databases/${DATABASE_ID}/collections/${TABLE_ID}/documents?limit=100`, {
        headers: { 'X-Appwrite-Project': PROJECT_ID }
      });
      const data2 = await res2.json();
      console.log("Fallback DATA2:", data2);
      allRows = data2.documents || [];
    }
    renderTable();
  } catch(err){
    console.error(err);
    document.getElementById('title').innerText = "Error loading: " + err.message;
  }
}

function renderTable(){
  const q = (document.getElementById('searchInput').value||"").toLowerCase();
  let pending = 0;
  let html = "";
  let filtered = allRows.filter(r=>{
    const d = r.data || r;
    return ((d.code||"")+" "+(d.fullname||"")+" "+(d.email||"")).toLowerCase().includes(q);
  });
  if(filtered.length===0){
    html = `<tr><td colspan="10" style="text-align:center;padding:30px;">No members found. Register a new member first, then click Refresh.<br><br>Check debug line below table.</td></tr>`;
  } else {
    filtered.forEach(r=>{
      const d = r.data || r; 
      const id = r.$id;
      const status = (d.status||"pending").toLowerCase();
      if(status==="pending") pending++;
      html += `<tr>
        <td><span class="code">${d.code||"No Code"}</span></td>
        <td>${d.fullname||"-"}</td>
        <td>${d.email||""}</td>
        <td>${d.phone||""}</td>
        <td>${d.dob||""}</td>
        <td>${d.gender||"-"}</td>
        <td>${(d.reason||"").substring(0,25)}</td>
        <td class="status-${status}">${status}</td>
        <td>${(r.$createdAt||"").substring(0,10)}</td>
        <td><button class="btn-approve" onclick="updateStatus('${id}','approved')">Approve</button><button class="btn-reject" onclick="updateStatus('${id}','rejected')">Reject</button></td>
      </tr>`;
    });
  }
  document.getElementById('tbody').innerHTML = html;
  document.getElementById('title').innerText = `Members - ${allRows.length} | Pending: ${pending}`;
}

async function updateStatus(id, status){
  try{
    const res = await fetch(`${ENDPOINT}/tablesdb/${DATABASE_ID}/tables/${TABLE_ID}/rows/${id}`, {
      method:'PATCH',
      headers:{ 'X-Appwrite-Project': PROJECT_ID, 'Content-Type':'application/json' },
      body: JSON.stringify({ data:{ status: status } })
    });
    const out = await res.json();
    console.log(out);
    alert("Updated to "+status);
    loadData();
  }catch(e){ alert("Error: "+e.message); }
}
</script>
</body>
</html>
