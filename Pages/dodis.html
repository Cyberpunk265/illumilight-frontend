<style>
/* SATANIC + BEHANCE */
body{ background:#050000 !important; }
.dodis-grid-wrap{ padding:0 16px 110px; background:#050000; }
#productGrid.behance-grid{ display:grid !important; grid-template-columns:1fr 1fr; gap:14px; overflow:visible !important; padding:0 !important; }
.behance-card{ background:#0d0000; border:1px solid #2a0000; border-radius:18px; overflow:hidden; padding:0 0 12px; cursor:pointer; transition:.3s; position:relative; }
.behance-card:active{ transform:scale(.97); border-color:#8b0000; }
.behance-card img{ width:100%; height:190px; object-fit:contain; background:#000; display:block; filter:contrast(1.1); }
.behance-card h3{ font-size:13px; margin:10px 12px 2px; color:#fff; font-family:Inter; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.behance-card .b-price{ font-size:13px; font-weight:700; color:#ff1a1a; margin:0 12px; }
.behance-card .b-cat{ font-size:9px; letter-spacing:2px; color:#8a5555; margin:0 12px; }
.behance-tabs{ display:flex; gap:8px; overflow-x:auto; padding:12px 16px; scrollbar-width:none; }
.behance-tabs button{ background:#140000; border:1px solid #3a0000; color:#aaa; padding:7px 14px; border-radius:20px; font-size:11px; letter-spacing:1px; white-space:nowrap; cursor:pointer; }
.behance-tabs button.active{ background:#8b0000; color:#fff; border-color:#ff1a1a; font-weight:700; }
.behance-pill{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); width:min(420px,92vw); background:#0d0000; color:#fff; border:1px solid #8b0000; border-radius:50px; z-index:9999; display:flex; align-items:center; padding:6px 6px 6px 12px; gap:10px; box-shadow:0 15px 40px rgba(0,0,0,.8), 0 0 20px rgba(255,0,0,.2); }
.behance-pill .pill-thumbs{ display:flex; align-items:center; }
.behance-pill .pill-thumbs img{ width:28px; height:28px; border-radius:50%; border:2px solid #0d0000; object-fit:cover; margin-left:-8px; background:#000; }
.behance-pill .pill-thumbs img:first-child{ margin-left:0; }
.behance-pill .pill-total{ flex:1; line-height:1.1; }
.behance-pill .pill-total small{ font-size:8px; letter-spacing:1px; color:#8a5555; }
.behance-pill .pill-total b{ font-size:13px; color:#fff; }
.behance-pill .pill-expand{ width:36px; height:36px; border-radius:50%; background:#8b0000; color:#fff; border:1px solid #ff1a1a; font-size:16px; cursor:pointer; }
.behance-sheet{ position:fixed; bottom:0; left:50%; transform:translate(-50%,105%); width:min(480px,100vw); max-height:82dvh; background:#0d0000; color:#fff; border:1px solid #8b0000; border-bottom:none; border-radius:24px 24px 0 0; z-index:9998; transition:.45s cubic-bezier(.22,1,.36,1); display:flex; flex-direction:column; overflow:hidden; }
.behance-sheet.show{ transform:translate(-50%,0); }
.qty-btn{ width:28px; height:28px; border-radius:50%; border:1px solid #8b0000; background:transparent; color:#ff1a1a; cursor:pointer; }
</style>
</head>
