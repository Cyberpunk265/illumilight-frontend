
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illumilight | Member Registration</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="member-register.css">
</head>

<body>
  <main class="member-register-container">

    <header class="member-register-header">
      <h1>Welcome to Illumilight</h1>
      <p>Create your membership account</p>
    </header>

    <section class="member-register-panel">
      <h2>Member Registration</h2>

      <p>
        Enter your approved membership details to create your account.
      </p>

      <form id="memberRegisterForm">

        <label for="membershipCode">Membership ID</label>
        <input
          type="text"
          id="membershipCode"
          name="membershipCode"
          placeholder="ILL-2026-0001"
          required
        >

        <label for="memberEmail">Registered Email</label>
        <input
          type="email"
          id="memberEmail"
          name="memberEmail"
          placeholder="Enter your registered email"
          required
        >

        <label for="memberPassword">Create Password</label>
        <input
          type="password"
          id="memberPassword"
          name="memberPassword"
          placeholder="Create a password"
          minlength="8"
          required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm your password"
          minlength="8"
          required
        >

        <button type="submit" id="registerButton">
          Create Account
        </button>

        <p id="registerMessage" role="status"></p>

      </form>

      <p class="login-link">
        Already registered?
        <a href="member-login.html">Sign in</a>
      </p>
    </section>

  </main>
</body>
</html>
